<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101215">
<meta name="description" content="Holotoner turns an image into a stereo field: move and rotate the image plane, and hear the space change.">
<meta property="og:title" content="Holotoner · Turn an image into a stereo field">
<meta property="og:description" content="Turn an image into a stereo field. Move, scale and rotate the image plane, watch it in the sound field and hear the space change. Use an image, text or a generated shape, right in the browser.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://janne-s.github.io/Holotoner/">
<meta property="og:image" content="https://janne-s.github.io/Holotoner/assets/og_image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Holotoner with a smiley image plane in motion and the same smiley traced by the sound in the polar sound field">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:creator" content="@JanneSarkela">
<meta name="twitter:title" content="Holotoner · Turn an image into a stereo field">
<meta name="twitter:description" content="Turn an image into a stereo field. Move, scale and rotate the image plane, watch it in the sound field and hear the space change. Use an image, text or a generated shape, right in the browser.">
<meta name="twitter:image" content="https://janne-s.github.io/Holotoner/assets/og_image.jpg">
<meta name="twitter:image:alt" content="Holotoner with a smiley image plane in motion and the same smiley traced by the sound in the polar sound field">
<title>Holotoner · Turn an image into a stereo field</title>
<link rel="canonical" href="https://janne-s.github.io/Holotoner/">
<link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="instrument">
<header class="masthead"><h1>HOLOTONER</h1></header>
<div class="transport">
  <button id="play" class="primary" disabled>▶ Play</button>
  <button id="restart" aria-label="Restart audio"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.34 6.34A8 8 0 1 1 4 12M6.34 4v2.34h2.34"/></svg></button>
  <button id="load-audio">Audio…</button>
  <button id="demo">Demo</button>
  <span id="audio-name">Demo</span>
  <label class="tempo"><input id="tempo" aria-label="Tempo in BPM" type="number" min="20" max="300" value="120"> BPM</label>
  <button id="save">Save</button><button id="restore">Open</button>
  <a id="source-link" class="github-link" href="https://github.com/janne-s/Holotoner" target="_blank" rel="noopener noreferrer" aria-label="Holotoner on GitHub" title="Holotoner on GitHub"><svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 .7a11.5 11.5 0 0 0-3.6 22.4c.6.1.8-.3.8-.6v-2.2c-3.4.7-4.1-1.4-4.1-1.4-.5-1.4-1.3-1.8-1.3-1.8-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0c2.2-1.5 3.2-1.2 3.2-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.8 5.4-5.5 5.7.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A11.5 11.5 0 0 0 12 .7Z"/>
        </svg></a>
</div>
<div class="views">
<section class="plane-panel">
  <div class="panel-title"><h2>Processed image</h2><div><button id="load-image">Image…</button><button id="text-toggle" aria-expanded="false">Text</button><button id="shape-toggle" aria-expanded="false">Shape</button><button id="reset-plane">Reset</button></div></div>
  <div class="plane-well">
    <canvas id="plane" aria-label="Image plane. Drag to move; use the handles to rotate, scale or roll. Motion contains keyboard controls."></canvas>
    <div id="text-panel" class="overlay" hidden>
      <form id="text-form"><input id="text" aria-label="Image text" value="HOLO" maxlength="512"><button>Use text</button></form>
      <div class="text-playback">
        <label>Layout <select id="text-layout"><option>Whole</option><option>Characters</option><option>Words</option></select></label>
        <label><input id="text-cycle" type="checkbox"> Cycle</label>
        <label>Step <input id="text-step" type="number" min="1" max="32" value="1"></label>
        <label>Rate <input id="text-rate" type="number" min="0" max="8" step="0.01" value="0.25"></label>
        <select id="text-note" aria-label="Text note value" hidden></select><button id="text-sync" aria-pressed="false" title="Sync text to tempo">♪</button>
      </div>
    </div>
    <div id="shape-panel" class="overlay" hidden><div id="shape-controls"><select id="shape-kind" aria-label="Shape"><option>Grid</option><option>Checker</option><option>Rings</option><option>Triangle</option><option>Sierpinski</option><option>Spiral</option><option>Lissajous</option><option>Smiley</option></select><label>Order <input id="shape-order" type="number" value="3" min="1" max="8"></label></div></div>
    <div class="well-caption"><button id="motion-toggle" aria-expanded="false">Motion ▴</button></div>
    <div id="motion" hidden><div class="motion-header"><select id="motion-shape" aria-label="Motion shape"><option>Swing</option><option>Spin</option></select><label>Depth <input id="motion-depth" type="range" min="0" max="1" step="0.01" value="0.5"></label><button id="reset-motion" type="button" title="Reset motion: every Rate and note off, Swing and Depth to defaults">Reset</button></div><div id="motion-axes"></div></div>
  </div>
</section>
<section class="audio-panel">
  <div class="panel-title"><h2>Sound field</h2><div class="projection"><button id="xy" aria-pressed="true">XY</button><button id="polar" aria-pressed="false">Polar</button></div></div>
  <div class="audio-well">
    <div class="space-heading">Space</div>
    <canvas id="response" aria-label="Space response and echo time by frequency"></canvas>
    <div class="scope-heading"><span><i class="input-key"></i> Input <i class="output-key"></i> Output</span></div>
    <canvas id="scope" aria-label="Measured input and output audio"></canvas>
    <div class="correlation"><span>−1</span><div><i id="correlation-tick"></i></div><span>+1</span><output id="correlation">0.00</output></div>
  </div>
</section>
</div>
<div class="stages">
  <section class="stage image-stage"><div class="stage-title"><h2>Image</h2></div><div id="image-controls" class="knobs"></div><div class="options"><select id="channel" aria-label="Image channel"><option>Off</option><option selected>Luma</option><option>Alpha</option><option>Red</option><option>Green</option><option>Blue</option></select><label><input id="normalize" type="checkbox" checked> Normalize</label><label><input id="invert" type="checkbox"> Invert</label><label><input id="binary" type="checkbox"> B/W</label></div></section>
  <section class="stage space-stage"><div class="stage-title"><h2>Space</h2></div><div id="space-controls" class="knobs"></div></section>
  <section class="stage out-stage"><div class="stage-title"><h2>Out</h2></div><div id="out-controls" class="knobs"></div><div class="options"><label><input id="delta" type="checkbox"> Delta</label></div></section>
</div>
<footer><span id="status" role="status" aria-live="polite">Loading…</span></footer>
</main>
<input type="file" id="audio-file" accept="audio/*" hidden>
<input type="file" id="image-file" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
<input type="file" id="state-file" accept=".json,application/json" hidden>
<script type="module" src="./app.js"></script>
</body></html>
