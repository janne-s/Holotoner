name: Web / GitHub Pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: emscripten-core/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: '4.0.22'
      - name: Build shared engine
        run: ./web/build.sh
      - name: Verify browser bridge and audio
        run: node web/tests/engine.mjs
      - name: Verify core
        run: |
          cmake -S . -B build/web-core -DCMAKE_BUILD_TYPE=Release -DHOLOTONER_BUILD_PLUGIN=OFF
          cmake --build build/web-core --parallel 2
          ctest --test-dir build/web-core --output-on-failure
      - name: Package corresponding source and licence
        run: |
          tar --exclude=.git --exclude=build --exclude=web/assets/source.tar.gz -czf /tmp/source.tar.gz .
          cp /tmp/source.tar.gz web/assets/source.tar.gz
          cp LICENSE web/assets/LICENSE
          touch web/.nojekyll
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: web
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
